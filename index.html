<style>
  html, body { margin: 0; height: 100%; background: #05050c; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }

  #turn { display: none; position: fixed; inset: 0; background: #05050c; color: #fff; font: 600 20px "Trebuchet MS", "Segoe UI", sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
</style>
</head>

<canvas id="c" width="1280" height="720" tabindex="0"></canvas>
<div id="turn">Tournez votre appareil à l'horizontale pour jouer ↻</div>
